<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TeamVault</title>
  <link rel="icon" type="image/svg+xml" href="Images/logo/teamvault-logo-stack5.svg">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>
  <header>
    <img src="Images/logo/teamvault-logo-stack5.svg" alt="">
    <span>TeamVault</span>
  </header>

  <main>
    <div class="login">

      <!-- Sign in -->
      <section id="loginView">
        <h1>Sign in</h1>

        <form id="loginForm" novalidate>
          <div class="field">
            <label for="loginUsername">Username</label>
            <input type="text" id="loginUsername" name="username" autocomplete="username" required>
          </div>

          <div class="field">
            <label for="loginPassword">Password</label>
            <div class="password-wrap">
              <input type="password" id="loginPassword" name="password" autocomplete="current-password" required>
              <button type="button" class="toggle" data-target="loginPassword" aria-label="Show password">Show</button>
            </div>
          </div>

          <p class="error" id="loginError" role="alert"></p>
          <button type="submit" class="submit">Sign in</button>
        </form>

        <p class="register">New to TeamVault? <a href="#register" id="showRegister">Create an account</a></p>
      </section>

      <!-- Register -->
      <section id="registerView" hidden>
        <h1>Create account</h1>

        <form id="registerForm" novalidate>
          <div class="field">
            <label for="regUsername">Username</label>
            <input type="text" id="regUsername" name="username" autocomplete="username" required>
          </div>

          <div class="field">
            <label for="regEmail">Email</label>
            <input type="email" id="regEmail" name="email" autocomplete="email" required>
          </div>

          <div class="field">
            <label for="regPassword">Password</label>
            <div class="password-wrap">
              <input type="password" id="regPassword" name="password" autocomplete="new-password" required>
              <button type="button" class="toggle" data-target="regPassword" aria-label="Show password">Show</button>
            </div>
          </div>

          <div class="field">
            <label for="regConfirm">Confirm password</label>
            <div class="password-wrap">
              <input type="password" id="regConfirm" name="confirm_password" autocomplete="new-password" required>
              <button type="button" class="toggle" data-target="regConfirm" aria-label="Show password">Show</button>
            </div>
          </div>

          <p class="error" id="registerError" role="alert"></p>
          <button type="submit" class="submit">Create account</button>
        </form>

        <p class="register">Already have an account? <a href="#login" id="showLogin">Sign in</a></p>
      </section>

    </div>
  </main>

  <script src="js/crypto.js"></script>
  <script>
    const views = {
      login: document.getElementById('loginView'),
      register: document.getElementById('registerView'),
    };
    const loginError = document.getElementById('loginError');
    const registerError = document.getElementById('registerError');
    const SERVER_ERROR = 'Could not reach the server. Make sure Apache is running.';

    // Show one view and hide the other
    function showView(name) {
      for (const key in views) views[key].hidden = key !== name;
      document.getElementById(name === 'login' ? 'loginUsername' : 'regUsername').focus();
    }

    // Send data to auth.php and return the JSON reply
    async function postToServer(fields) {
      const body = new FormData();
      for (const key in fields) body.append(key, fields[key]);
      const response = await fetch('auth.php', { method: 'POST', body });
      return response.json();
    }

    // Disable the button while the browser does the encryption work (it takes a moment)
    function setBusy(form, busy, label) {
      const button = form.querySelector('.submit');
      button.disabled = busy;
      button.textContent = busy ? 'Please wait...' : label;
    }

    // Switch between sign in and register
    document.getElementById('showRegister').addEventListener('click', (e) => {
      e.preventDefault();
      showView('register');
    });
    document.getElementById('showLogin').addEventListener('click', (e) => {
      e.preventDefault();
      showView('login');
    });

    // Show / hide password buttons
    document.querySelectorAll('.toggle').forEach((btn) => {
      btn.addEventListener('click', () => {
        const input = document.getElementById(btn.dataset.target);
        const show = input.type === 'password';
        input.type = show ? 'text' : 'password';
        btn.textContent = show ? 'Hide' : 'Show';
        btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
      });
    });

    // Sign in
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const username = form.username.value.trim();
      const password = form.password.value;
      loginError.classList.remove('ok');
      if (!username || !password) {
        loginError.textContent = 'Enter both your username and password.';
        (username ? form.password : form.username).focus();
        return;
      }

      setBusy(form, true, 'Sign in');
      try {
        // The server gets a login secret made from the password, never the password itself
        const data = await postToServer({ action: 'login', username, password: await TVCrypto.loginSecret(username, password) });
        if (!data.ok) {
          loginError.textContent = data.error;
          return;
        }
        // Unlock your private key with the password and keep it for this browser tab
        const privateKey = await TVCrypto.unlockPrivateKey(data.wrapped_private_key, password);
        sessionStorage.setItem('tv_private', privateKey);
        window.location.href = 'main.html';
      } catch (err) {
        loginError.textContent = err instanceof TypeError ? SERVER_ERROR : 'Could not unlock your encryption keys.';
      } finally {
        setBusy(form, false, 'Sign in');
      }
    });

    // Register
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const username = form.username.value.trim();
      const email = form.email.value.trim();
      const password = form.password.value;

      let msg = '';
      if (!username || !email || !password || !form.confirm_password.value) {
        msg = 'Fill in all the fields.';
      } else if (!form.email.checkValidity()) {
        msg = 'Enter a valid email address.';
      } else if (password.length < 8) {
        msg = 'Password must be at least 8 characters.';
      } else if (password !== form.confirm_password.value) {
        msg = 'Passwords do not match.';
      }
      if (msg) {
        registerError.textContent = msg;
        return;
      }

      setBusy(form, true, 'Create account');
      try {
        // Make your encryption keys in this browser. The private key is locked with your password.
        const keys = await TVCrypto.createAccountKeys(password);
        const data = await postToServer({
          action: 'register',
          username,
          email,
          password: await TVCrypto.loginSecret(username, password),
          public_key: keys.publicKey,
          wrapped_private_key: keys.wrappedPrivateKey,
        });
        if (!data.ok) {
          registerError.textContent = data.error;
          return;
        }
        form.reset();
        registerError.textContent = '';
        showView('login');
        loginError.classList.add('ok');
        loginError.textContent = 'Account created. Sign in to continue.';
      } catch (err) {
        registerError.textContent = SERVER_ERROR;
      } finally {
        setBusy(form, false, 'Create account');
      }
    });

    // Encryption only works on https:// or http://localhost
    if (!window.crypto || !window.crypto.subtle) {
      loginError.textContent = 'Encryption needs https:// or http://localhost. Open this page as http://localhost/Teamvault/login.html';
    }

    // If you are already signed in and your keys are still in this tab, go straight to the app
    fetch('auth.php?action=me')
      .then((response) => response.json())
      .then((data) => {
        if (data.username && sessionStorage.getItem('tv_private')) window.location.href = 'main.html';
        else showView('login');
      })
      .catch(() => showView('login'));
  </script>
</body>
</html>
